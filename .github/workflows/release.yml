name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          TAG_VER="${{ github.event.inputs.version || github.ref_name }}"
          cp app/build/outputs/apk/release/*.apk release-assets/momostack-${TAG_VER}.apk
          cp app/build/outputs/apk/release/*.apk release-assets/momostack-release.apk
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: MomoStack ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## MomoStack 🔒📱
            **Local-First Android Link & Note Capture App**
            
            ### Features
            - ⚡ Instant sub-50ms Share Sheet capture
            - 🔄 Background URL enrichment via WorkManager
            - 🏷️ Heuristic auto-categorization
            - 📝 First-class Notes with large clipboard paste support
            - 🛡️ Zero cloud telemetry, local-first Room SQLite storage
            - 📦 Versioned JSON backup & restore
            - 🎨 Anti-AI-slop Material 3 design system
            
            ### Verification
            Checksums are provided in `SHA256SUMS.txt`.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram
        run: |
          curl -s -F "chat_id=1263089875" \
               -F "document=@release-assets/momostack-release.apk;filename=momostack-${{ github.event.inputs.version || github.ref_name }}.apk" \
               -F "caption=🚀 MomoStack ${{ github.event.inputs.version || github.ref_name }} Release

✨ Updates:
• Screenshot Auto-Capture across all Android OEMs
• Notifications: 📸 Screenshot Captured & ✨ Transcription Completed with 1-tap [Copy Text]
• Direct Image Sharing into Screenshot Vault with instant OCR
• Editable & Selectable OCR Text Field
• Isolated Room DB & On-Device ML Kit" \
               "https://api.telegram.org/bot8698545201:AAFU8Xe_ScRjdW5a0RjEJrbgOH5FibKmylY/sendDocument"
